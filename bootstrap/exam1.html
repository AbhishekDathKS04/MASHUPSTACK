<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body class="bg-primary">
    <div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card mt-5 p-5">
                <h2>Sign Up</h2>
                <p class="text-muted">Please fill in this form to create an account.</p>

                <form>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <input type="text" class="form-control bg-light border-0" placeholder="First Name">
                        </div>

                        <div class="form-group col-md-6">
                            <input type="text" class="form-control bg-light border-0" placeholder="Last Name">
                        </div>
                    </div>

                    <div class="form-group">
                        <input type="email" class="form-control bg-light border-0" placeholder="Email">
                    </div>

                    <div class="form-group">
                        <input type="password" class="form-control bg-light border-0" placeholder="Password">
                    </div>

                    <div class="form-group">
                        <input type="password" class="form-control bg-light border-0" placeholder="Confirm Password">
                    </div>

                    <div class="form-group form-check">
                        <input type="checkbox" class="form-check-input">
                        <label class="form-check-label text-muted" for="terms">
                            I accept the <a href="#">Terms of Use</a> & <a href="#">Privacy Policy</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary font-weight-bold">Sign Up</button>
                </form>
            </div>

        </div>
    </div>
</div>
</body>
</html>
