<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Signup</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Signup</legend>
        <label for="fname">Full name:</label><br>
        <input type="text" id="fname" name="fname" placeholder="enter your full name" required><br>
        <label for="email">email:</label><br>
        <input type="email" name="email" id="email" placeholder="enter email address" required><br>
        <label for="terms">
            <input type="checkbox" name="terms and conditions" id="terms" required>
            I accept the terms and conditions
        </label><br>
        <input type="submit" value="submit">
        </fieldset>
    </form>
</body>
</html>
