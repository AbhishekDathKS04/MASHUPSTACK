<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
</head>
<body>
     <form>
        <fieldset>
            <legend>Contact Us</legend>
        <label for="fname">Full name:</label><br>
        <input type="text" id="fname" name="fname" pattern="[A-Za-z]{2,80}" placeholder="enter your full name" required><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="enter your email address" required><br>
        <label for="phone">contact num:</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="enter your contact number" required><br>
        <label for="subject">subject:</label><br>
        <textarea id="subject" name="subject" placeholder="write your subject here" maxlength="200" required></textarea><br>
        <label for="terms">
        <input type="checkbox" name="terms and conditions" id="terms" required>I accept the terms and conditions
        </label><br>
        <input type="submit" value="submit"><br>
            <p>Thank you for contacting us. We will get back to you as soon as possible.</p>
        </fieldset>
    </form>
</body>
</html>
