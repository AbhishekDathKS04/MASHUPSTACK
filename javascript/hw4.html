<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Generate a random mystery level between 1 and 50
    let mystery = Math.floor(Math.random() * 50) + 1;

    // Store the user's score as a string
    let userScore = "45";

    // Convert the score into a number
    let score = Number(userScore);

    // Find the difference between the two numbers
    let difference = Math.abs(mystery - score);

    // Calculate the square root of the score
    let squareRoot = Math.sqrt(score);

    // Get the value of PI
    let pi = Math.PI;

    // Convert the string into a number automatically
    let result = "20" * 5;

    // Find the highest and lowest values
    let highest = Math.max(10, 20, mystery);
    let lowest = Math.min(10, 20, mystery);

    // Display the results
    console.log("Mystery Level: " + mystery);
    console.log("User Score: " + score);
    console.log("Absolute Difference: " + difference);
    console.log("Square Root: " + squareRoot);
    console.log("Value of PI: " + pi);
    console.log("Implicit Conversion: " + result);
    console.log("Highest Value: " + highest);
    console.log("Lowest Value: " + lowest);
    </script>
</body>
</html>
