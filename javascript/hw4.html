<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let random = Math.floor(Math.random() * 100) + 1;

        let user = "75";
        let score = Number(user);

        let diff = random - score;

        let rounded = Math.round(Math.sqrt(score));

        let pi = Math.PI;

        let impcon = "50" * 2;

        // Display outputs
        document.getElementById("random").innerHTML = random;
        document.getElementById("user").innerHTML = score;
        document.getElementById("diff").innerHTML = diff;
        document.getElementById("rounded-sqrt").innerHTML = rounded;
        document.getElementById("pi").innerHTML = pi;
        document.getElementById("impcon").innerHTML = impcon;
    </script>
</body>
</html>
