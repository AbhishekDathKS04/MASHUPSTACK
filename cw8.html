<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <h2>Grocery Store Calculator</h2>

    <script>
        var count = 0;

        while (count < 5) {
            var code = prompt("Enter product code (1-3):");
            var quantity = Number(prompt("Enter quantity:"));

            var price = 0;
            var item = "";
            var total = 0;

            switch (code) {
                case "1":
                    item = "Apple";
                    price = 30;
                    break;

                case "2":
                    item = "Banana";
                    price = 10;
                    break;

                case "3":
                    item = "Mango";
                    price = 50;
                    break;

                default:
                    console.log("Invalid product code");
                    continue;
            }

            total = price * quantity;

            console.log("Product: " + item);
            console.log("Total Price: " + total);

            if (total > 100) {
                console.log("High purchase");
            } else {
                console.log("Normal purchase");
            }

            count++;
        }
    </script>
</body>
</html>
